spring.datasource.url=jdbc:postgresql://localhost:5432/rosetta
spring.datasource.username=postgres
spring.datasource.password=password1107
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port = 1107

logging.file.name = rosetta.log
logging.file.max-size=1MB
logging.file.max-history=10

# Redis connection (Memurai on Windows, default port)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=yourpassword
spring.data.redis.timeout=2000ms

# Lettuce connection pool (3 for 3 kafka threads, 1 for health check)
spring.data.redis.lettuce.pool.max-active=4
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=4


spring.cassandra.contact-points=127.0.0.1
spring.cassandra.port=9042
#datacenter property is mandatory and datacenter1 is the default placeholder.
spring.cassandra.local-datacenter=dc1
spring.cassandra.keyspace-name=rosetta
spring.cassandra.schema-action=create_if_not_exists

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=rosetta
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ---- Ollama ----
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:1.5b
spring.ai.ollama.chat.options.temperature=0.7

# ---- Google Gemini (Developer API key mode) ----
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.0-flash
spring.ai.google.genai.chat.options.temperature=0.7